# Project Darwin — full stack in one command.
#
#   1. cp .env.example .env     # set ENCRYPTION_KEY (users bring OpenRouter keys per session)
#   2. docker compose up --build
#   3. open http://localhost:3000
#
# Three services:
#   - postgres : the ledger
#   - oracle   : FastAPI engine + WebSocket  (http://localhost:8000)
#   - arena    : Next.js React UI              (http://localhost:3000)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: darwin
      POSTGRES_PASSWORD: darwin
      POSTGRES_DB: darwin
    volumes:
      - darwin_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darwin"]
      interval: 5s
      timeout: 5s
      retries: 10

  oracle:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://darwin:darwin@postgres:5432/darwin
      # Models go through OpenRouter (one OpenAI-compatible gateway). Users bring
      # their own key per session (BYOK); the key below is an optional operator
      # fallback — leave blank for a public deploy.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-opus-4.7}
      # Required in production so per-session BYOK keys survive a restart.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ERROR_THRESHOLD: ${ERROR_THRESHOLD:-3}
    volumes:
      - darwin_logs:/app/thought_logs
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  arena:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* must be baked at build time. The browser is on the host,
      # so localhost:8000 (mapped from oracle) is the correct address.
      args:
        NEXT_PUBLIC_ORACLE_HTTP: http://localhost:8000
        NEXT_PUBLIC_ORACLE_WS: ws://localhost:8000/ws
    depends_on:
      - oracle
    ports:
      - "3000:3000"

volumes:
  darwin_pg:
  darwin_logs:
