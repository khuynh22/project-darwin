services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: darwin
      POSTGRES_PASSWORD: darwin
      POSTGRES_DB: darwin
    ports:
      - "5432:5432"
    volumes:
      - darwin_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darwin"]
      interval: 5s
      timeout: 5s
      retries: 5

  oracle:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://darwin:darwin@postgres:5432/darwin
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  darwin_pg:
